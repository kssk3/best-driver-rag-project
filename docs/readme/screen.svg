<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="화면 구성 도식">
  <style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}</style>
  <rect width="960" height="540" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect width="960" height="40" rx="12" fill="#e2e8f0"/>
  <circle cx="24" cy="20" r="6" fill="#f87171"/><circle cx="46" cy="20" r="6" fill="#fbbf24"/><circle cx="68" cy="20" r="6" fill="#4ade80"/>
  <text x="480" y="26" text-anchor="middle" font-size="14" fill="#475569">Streamlit · 서울 분리배출 RAG</text>
  <!-- 채팅 -->
  <rect x="24" y="60" width="560" height="456" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="44" y="90" font-size="16" font-weight="700" fill="#0f172a">질문과 답변</text>
  <rect x="300" y="106" width="264" height="44" rx="10" fill="#d1fae5"/>
  <text x="316" y="134" font-size="14" fill="#064e3b">서대문구 유리병 어떻게 버려요?</text>
  <rect x="44" y="168" width="430" height="170" rx="10" fill="#f1f5f9"/>
  <text x="60" y="196" font-size="14" fill="#0f172a">답변: 품목과 배출 조건에 맞는 방법 안내</text>
  <text x="60" y="224" font-size="13" fill="#64748b">조건이 부족하면 되묻고,</text>
  <text x="60" y="246" font-size="13" fill="#64748b">자료에 없으면 정보 부족을 알림</text>
  <rect x="60" y="272" width="190" height="42" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="72" y="298" font-size="12" fill="#334155">[1] 조례 별표 · 원문 위치</text>
  <rect x="44" y="460" width="520" height="40" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="60" y="485" font-size="13" fill="#94a3b8">질문을 입력하세요</text>
  <!-- 패널 -->
  <rect x="604" y="60" width="332" height="456" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="624" y="90" font-size="16" font-weight="700" fill="#0f172a">관찰 패널</text>
  <text x="624" y="120" font-size="13" fill="#475569">해석한 지역 · 다듬은 검색 질의</text>
  <text x="624" y="146" font-size="13" fill="#475569">검색 후보 순위 / 최종 인용 구분</text>
  <text x="624" y="172" font-size="13" fill="#475569">A · B · C 검색 설정</text>
  <text x="624" y="500" font-size="12" fill="#64748b">※ 화면 구성을 설명하는 도식이며 실제 캡처가 아닙니다</text>
</svg>
