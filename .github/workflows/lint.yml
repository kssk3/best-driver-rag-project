name: Lint
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.13.9
      - id: sync
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github src scripts tests app.py
      - name: Ruff format check
        # 린트가 실패해도 포맷 결과를 함께 보도록 실행한다. 환경 준비 실패 시에는 건너뛴다.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked ruff format --check --diff src scripts tests app.py
      - name: Mypy type check
        # 검사 범위는 pyproject.toml의 [tool.mypy] files에서 관리한다.
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --locked mypy
